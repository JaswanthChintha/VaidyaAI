services:
  - type: web
    name: vaidyaai-ai
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "120"
      - key: GEMINI_MAX_RETRIES
        value: "3"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PRELOAD_ON_STARTUP
        value: "true"

  - type: web
    name: vaidyaai
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npm ci --prefix backend --omit=dev &&
      npm ci --prefix frontend --include=dev &&
      npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: STORAGE_DRIVER
        value: mongo
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: vaidyaai-ai
          envVarKey: AI_SERVICE_API_KEY
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: AI_SERVICE_STAGE_TIMEOUT_MS
        value: "120000"
      - key: AI_SERVICE_WAKE_WAIT_MS
        value: "180000"
